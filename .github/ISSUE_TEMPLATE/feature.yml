name: Funcionalidade
description: Propor uma capacidade nova
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Que problema resolve
      description: O problema, não a solução. Se não houver problema, não há funcionalidade.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposta
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: No mínimo uma. "A que eu já ia fazer" não conta como comparação.
    validations:
      required: true

  - type: textarea
    id: cost
    attributes:
      label: Custo aceite
      description: Toda escolha tem custo. Qual é o desta?
    validations:
      required: true
