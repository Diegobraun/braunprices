default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # As fixtures são capturas byte a byte de páginas reais. Normalizar espaços ou
      # acrescentar uma linha final tornaria-as uma versão arranjada do que a loja
      # serviu — e o valor de uma fixture está precisamente em ser o original.
      - id: trailing-whitespace
        exclude: ^tests/fixtures/
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]

      - id: lint-imports
        name: contratos de arquitetura (import-linter)
        # PYTHONPATH explícito: em macOS um .pth com a flag UF_HIDDEN é ignorado
        # por site.addpackage() sem aviso, e o editable install fica inerte.
        entry: env PYTHONPATH=src uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
